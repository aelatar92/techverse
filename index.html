<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechVerse — كون المصطلحات التقنية</title>
<meta name="description" content="TechVerse: an interactive 3D space encyclopedia of 286+ tech terms — networking, Linux, security, AI, dev, databases, blockchain, IoT and more — كون تفاعلي ثلاثي الأبعاد لأكتر من 286 مصطلح تقني عبر 12 مجال.">
<link rel="canonical" href="https://techverse.aelatar.com/">
<meta name="robots" content="index, follow">
<link rel="sitemap" type="application/xml" href="/sitemap.xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TechVerse">
<meta property="og:title" content="TechVerse — كون المصطلحات التقنية">
<meta property="og:description" content="كون تفاعلي ثلاثي الأبعاد لأكتر من 286 مصطلح تقني عبر 12 مجال — شبكات، لينكس، أمن سيبراني، ذكاء اصطناعي، تطوير برمجيات، وأكتر.">
<meta property="og:url" content="https://techverse.aelatar.com/">
<meta property="og:locale" content="ar_AR">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "TechVerse",
  "url": "https://techverse.aelatar.com/",
  "description": "An interactive space-themed encyclopedia of technology terms across networking, Linux, systems, security, AI, software development, databases, web, blockchain, IoT, and project management.",
  "inLanguage": ["ar", "en"]
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="stage"><canvas id="stage-canvas"></canvas></div>

<div id="topbar">
  <div>
    <div id="title"></div>
    <span id="subtitle"></span>
  </div>
  <div id="searchWrap">
    <input id="search" list="termsList" autocomplete="off">
    <datalist id="termsList"></datalist>
  </div>
  <button id="journeyChip" title="رحلتي">⭐ <span id="journeyPointsInline">0</span></button>
  <button id="statsBtn">📊</button>
  <button id="langToggle"></button>
</div>

<div id="hint"></div>

<div id="legend"></div>

<div id="zoomctl">
  <button id="zoomIn">＋</button>
  <button id="zoomOut">－</button>
  <button id="zoomReset">⟳</button>
</div>

<div id="panel">
  <button id="closePanel">✕</button>
  <div id="panelInner">
    <div id="panelBadge" class="badge"></div>
    <div id="panelName"></div>
    <div id="panelDefs"></div>
    <div id="relTitle" class="relTitle"></div>
    <div id="relList"></div>
  </div>
</div>

<div id="notFound"></div>

<div id="badgeToastWrap"></div>

<div id="hoverTeaser"></div>

<div id="statsPanel">
  <button id="closeStats">✕</button>
  <div id="statsInner">
    <div id="statsTitleJourney" class="statsSectionTitle"></div>
    <div id="journeyOverview"></div>
    <div id="journeyBadges"></div>
    <div id="statsTitleRecent" class="statsSectionTitle"></div>
    <div id="recentList"></div>
    <div id="statsTitleGalaxies" class="statsSectionTitle"></div>
    <div id="galaxyStats"></div>
    <div id="statsTitleConstellations" class="statsSectionTitle"></div>
    <div id="constellationList"></div>
    <div id="constellationSteps"></div>
  </div>
</div>

<div id="footerbar">
  <span id="visitorCount">👁 <span data-goatcounter-visits>—</span></span>
  <a id="coffeeLink" href="#" target="_blank" rel="noopener">☕</a>
</div>

<!-- GoatCounter analytics -->
<script data-goatcounter="https://aelatar.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<script type="module" src="js/app.js"></script>
</body>
</html>
